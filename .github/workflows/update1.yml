name: Update RSS Feed

on:
  schedule:
    - cron: "0 * * * *"  # every hour
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
        env:
          LOG_LEVEL: info
          CAPTCHA_SOLVER: none

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Wait for FlareSolverr
        run: |
          echo "Waiting for FlareSolverr to be ready..."
          for i in {1..30}; do
            if curl -s http://localhost:8191 > /dev/null; then
              echo "FlareSolverr is ready!"
              break
            fi
            echo "Attempt $i: FlareSolverr not ready yet..."
            sleep 2
          done

      - name: Install dependencies
        run: npm install

      # ===== RUN BOTH FEEDS (separate, fail-safe) =====
      - name: Generate English RSS
        run: npm run english
        env:
          FLARESOLVERR_URL: http://localhost:8191

      - name: Generate Bangla RSS
        run: npm run bangla
        env:
          FLARESOLVERR_URL: http://localhost:8191

      # ===== COMMIT BOTH FILES =====
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          CHANGED=0

          if [ -f feeds/feed.xml ]; then
            git add feeds/feed.xml
            CHANGED=1
          else
            echo "⚠️ feeds/feed.xml not found"
          fi

          if [ -f feeds/bangla_feed.xml ]; then
            git add feeds/bangla_feed.xml
            CHANGED=1
          else
            echo "⚠️ feeds/bangla_feed.xml not found"
          fi

          if [ $CHANGED -eq 1 ]; then
            git commit -m "Auto-update RSS feeds [skip ci]" || echo "No changes to commit"
            git push
          else
            echo "⚠️ No feed files found. Skipping commit."
          fi